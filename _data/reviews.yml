  text: |-
    If you're looking for the BEST hand therapist around, look no further than Jade at Reach Beyond Therapy. She's truly a gem--knowledgeable, compassionate, and exceptional at what she does.

    My son broke his finger playing football at school. We first went to an orthopedic clinic, where we saw a nurse practitioner who said it wasn't too bad, handed us a basic plastic splint, and told us to leave it on for six weeks--no real guidance, no explanation.
    Three days later, my son's finger was even more swollen and painful. We ended up doing a telehealth appointment with an orthopedic surgeon who finally diagnosed him with mallet finger and said he needed a custom splint--that the one we had was actually making things worse.
    Unfortunately, it was the weekend and we couldn't get in anywhere for a couple of days.

    Enter Jade at Reach Beyond Therapy. She saw us on a Saturday and immediately changed everything. She took the time to explain the injury in detail, showed us how to properly care for it, and made multiple custom splints that were far superior in both comfort and
    effectiveness. Honestly, Jade's knowledge exceeded that of any provider we had seen.

    Over the next several weeks and months, Jade followed up regularly to check on our progress. She gave us exercises to support healing and was always incredibly thorough and supportive. Although we had to see other occupational therapists at times due to Jade's full schedule, none came close to matching her skill, care, or the quality of the splints she made. The others didn't fit as well or last as long--and frankly, they just didn't compare.

    Jade is a true magician. Her expertise, warmth, and attention to detail set her apart in every way. We're so grateful to her and to Reach Beyond Therapy for being there when we needed it most. We wouldn't go anywhere else--and highly recommend them to anyone in need of top-notch hand therapy.

