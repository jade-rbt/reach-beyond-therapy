  stars: 5
  text: |-
    I had the privilege of working with Jade Wong as my occupational therapist for four months following a significant wrist injury that required surgery on three different parts of my right wrist. As a Firefighter, returning to work and regaining full functionality of my hand and wrist was not just a matter of personal importance, but essential to my career and the safety of those I serve. When I first started therapy with Jade, I was experiencing daily pain, nerve pinching, numbness, and had almost no range of motion. Thanks to her expertise, professionalism, and dedication, I’ve made incredible progress — now experiencing very minimal pain, no numbness, and near full range of motion.

    Jade is exceptional at what she does, and her deep knowledge and skillset were apparent from our very first session. She carefully assessed my injury and tailored my treatment plan to meet my specific needs. I was continually impressed by how she took the time to listen to my concerns about pain and discomfort between sessions, even when they seemed small or hard to describe. She would adjust the treatment plan accordingly, always evaluating my body mechanics and explaining the reasoning behind any changes she made.

    One thing that stood out to me was Jade's ability to teach and explain complex medical concepts in a way that was easy to understand. She walked me through each exercise, stretch, and treatment, always explaining why it was important and how it would help with my recovery. This not only helped me feel more engaged in the process, but it also gave me the tools and confidence to continue my exercises at home, knowing that I was doing them correctly. Jade held me accountable for my progress and kept me motivated throughout the entire process, making sure that I followed through with my home exercises and stretches, which was critical for my recovery.

    Another aspect of Jade's professionalism that I greatly admired was her ability to teach and mentor occupational therapy students who were rotating through her sessions. She was clear, concise, and patient in her instructions, setting high expectations while ensuring that the students learned in a hands-on, practical way. I could see how much they respected her expertise and the impact she had on their education. Jade is clearly a natural teacher, and I believe she should continue to teach future occupational therapists because she has so much valuable knowledge to offer.

    In short, I don't think I would have progressed as well with anyone else. Jade Wong is not only an outstanding occupational therapist, but she is also a compassionate professional who truly cares about her patients' outcomes. I owe a significant part of my recovery to her, and I would highly recommend her to anyone in need of occupational hand therapy.

