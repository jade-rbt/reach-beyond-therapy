title: Reach Beyond Therapy
url: "https://www.reachbeyondtherapy.com"
baseurl: ""

# Google Apps Script web-app URL that logs email sign-ups to a Google Sheet.
# Setup steps: google-apps-script/signup-to-sheet.gs
signup_endpoint: "https://script.google.com/macros/s/AKfycbwdTiaF8rhO51K-7TMVBPpxvh97n4hfSyFGu1Ni9fzieRbN0KyBW4n5VL1iW_xNYlw/exec"

permalink: /blog/:slug/

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      permalink: /:basename.html
  - scope:
      path: "sitemap.xml"
    values:
      permalink: /sitemap.xml
  - scope:
      path: "admin"
    values:
      sitemap: false
  - scope:
      path: "assets"
    values:
      sitemap: false

exclude:
  - "google-apps-script"
  - "_site"
  - "images/README.md"
  - "ISSUES.md"
  - "README.md"
  - "Style-Cheat-Sheet-RBT.pdf"
  - "Brand Style Guide-Full-RBT.pdf"
